version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  # Keep npm/pnpm workspace dependencies up to date
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    # Group all patch updates into one PR and all minor updates into another.
    # Major version bumps are left ungrouped so they get individual PRs and
    # require manual review.
    groups:
      npm-patch:
        update-types:
          - patch
      npm-minor:
        update-types:
          - minor
    # Label every Dependabot npm PR so the auto-merge workflow can target it.
    labels:
      - dependencies
    # No major-version ignore: majors must surface as individual review PRs.

  # Parser used by the technology audit; no application Python dependencies.
  - package-ecosystem: pip
    directory: "/scripts"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
    groups:
      audit-python:
        update-types:
          - patch
          - minor
