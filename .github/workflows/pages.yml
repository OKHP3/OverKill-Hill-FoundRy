name: Deploy FoundRy workbench to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel an in-progress run if a newer
# commit is pushed before it finishes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build and verify FoundRy Pages base path
        working-directory: artifacts/custom-gpt-creator
        env:
          NODE_ENV: production
          PORT: 5000
          # Follow the actual Pages path, including repository casing or custom domains.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm run test:pages-base-path

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/custom-gpt-creator/dist/public

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('artifacts/custom-gpt-creator/package.json') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        working-directory: artifacts/custom-gpt-creator
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        working-directory: artifacts/custom-gpt-creator
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Test capability storage and source bundles
        run: pnpm run test:capability

      - name: Check committed GitHub Markdown fixture
        working-directory: artifacts/custom-gpt-creator
        run: pnpm run test:github-markdown:fixture

      - name: Validate GitHub Markdown rendering
        working-directory: artifacts/custom-gpt-creator
        run: pnpm run test:github-markdown

      - name: Run e2e tests
        working-directory: artifacts/custom-gpt-creator
        run: pnpm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ github.run_id }}
          path: .cache/custom-gpt-creator-test-results
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live page and application assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Checking ${PAGE_URL}"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 --retry 5 --retry-delay 10 --retry-connrefused "${PAGE_URL}")
          echo "HTTP status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "::error::Smoke test failed — expected 200 but got ${HTTP_STATUS} for ${PAGE_URL}"
            exit 1
          fi
          python3 - <<'PY'
          import os
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit
          from urllib.request import urlopen

          page = os.environ["PAGE_URL"]
          base = urlsplit(page)
          class Assets(HTMLParser):
              urls = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "script" and attrs.get("src"):
                      self.urls.append(attrs["src"])
                  if tag == "link" and attrs.get("rel") == "stylesheet" and attrs.get("href"):
                      self.urls.append(attrs["href"])

          parser = Assets()
          with urlopen(page, timeout=30) as response:
              parser.feed(response.read().decode("utf-8"))
          local = [urljoin(page, value) for value in parser.urls
                   if urlsplit(urljoin(page, value)).netloc == base.netloc]
          if not local:
              raise SystemExit("No application assets found in deployed HTML")
          for url in local:
              if not urlsplit(url).path.startswith(base.path.rstrip("/") + "/"):
                  raise SystemExit("Asset uses a different Pages base path: " + url)
              with urlopen(url, timeout=30) as response:
                  if response.status != 200 or "text/html" in response.headers.get("Content-Type", ""):
                      raise SystemExit("Invalid deployed asset: " + url)
              print("Verified asset:", url)
          PY
          echo "Smoke test passed."
