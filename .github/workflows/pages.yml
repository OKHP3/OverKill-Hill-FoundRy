name: Deploy Custom GPT Creator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel an in-progress run if a newer
# commit is pushed before it finishes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build Custom GPT Creator
        working-directory: artifacts/custom-gpt-creator
        env:
          NODE_ENV: production
          PORT: 5000
          # Project site URL is https://okhp3.github.io/OverKill-Hill-FoundRy/
          # If a custom domain is configured at the repository level, change to /
          BASE_PATH: /OverKill-Hill-FoundRy/
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/custom-gpt-creator/dist/public

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('artifacts/custom-gpt-creator/package.json') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        working-directory: artifacts/custom-gpt-creator
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        working-directory: artifacts/custom-gpt-creator
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run e2e tests
        working-directory: artifacts/custom-gpt-creator
        run: pnpm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ github.run_id }}
          path: .cache/custom-gpt-creator-test-results
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke test — verify live site returns 200
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Checking ${PAGE_URL}"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 --retry 5 --retry-delay 10 --retry-connrefused "${PAGE_URL}")
          echo "HTTP status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "::error::Smoke test failed — expected 200 but got ${HTTP_STATUS} for ${PAGE_URL}"
            exit 1
          fi
          echo "Smoke test passed."
