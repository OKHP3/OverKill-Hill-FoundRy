name: Deploy Custom GPT Creator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel an in-progress run if a newer
# commit is pushed before it finishes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: artifacts/mockup-sandbox
        env:
          NODE_ENV: production
          # Project site URL is https://okhp3.github.io/OverKill-Hill-FoundRy/
          # If a custom domain is configured at the repository level, change to /
          BASE_PATH: /OverKill-Hill-FoundRy/
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/mockup-sandbox/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke test — verify live site returns 200
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Checking ${PAGE_URL}"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 --retry 5 --retry-delay 10 --retry-connrefused "${PAGE_URL}")
          echo "HTTP status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "::error::Smoke test failed — expected 200 but got ${HTTP_STATUS} for ${PAGE_URL}"
            exit 1
          fi
          echo "Smoke test passed."
