name: E2E Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('artifacts/custom-gpt-creator/package.json') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        working-directory: artifacts/custom-gpt-creator
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        working-directory: artifacts/custom-gpt-creator
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run e2e tests
        working-directory: artifacts/custom-gpt-creator
        run: pnpm run test:e2e

      - name: Upload Playwright traces
        id: upload-traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ github.run_id }}
          path: .cache/custom-gpt-creator-test-results
          retention-days: 7

      - name: Comment Playwright trace link on pull request
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- playwright-trace-artifact -->';
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${{ steps.upload-traces.outputs.artifact-id }}`;
            const body = [
              marker,
              '### Playwright e2e failure',
              '',
              `Download the [Playwright trace artifact](${artifactUrl}) from this run.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existingComment = comments.find((comment) =>
              comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
