name: Filename Compliance Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  filename-check:
    name: Check filename naming conventions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run filename compliance check
        run: |
          python3 scripts/normalize_filenames.py . \
            --recursive \
            --ascii-only \
            --include-dirs \
            --check
        shell: bash
