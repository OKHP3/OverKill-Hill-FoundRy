name: FoundRy governance

on:
  push:
    paths:
      - "manifest.yaml"
      - "registry/**"
      - "schemas/**"
      - "_template/**"
      - "scripts/governance.py"
      - "scripts/governance-check.py"
      - "scripts/manifest-audit.py"
      - "scripts/registry-audit.py"
      - "scripts/foundry-sync.py"
      - "scripts/public-graduation-audit.py"
      - "tests/test-public-graduation-audit.py"
      - "examples/release-candidates/**"
      - "docs/publication-boundary.md"
  pull_request:
    paths:
      - "manifest.yaml"
      - "registry/**"
      - "schemas/**"
      - "_template/**"
      - "scripts/governance.py"
      - "scripts/governance-check.py"
      - "scripts/manifest-audit.py"
      - "scripts/registry-audit.py"
      - "scripts/foundry-sync.py"
      - "scripts/public-graduation-audit.py"
      - "tests/test-public-graduation-audit.py"
      - "examples/release-candidates/**"
      - "docs/publication-boundary.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run complete governance validation
        run: python3 scripts/governance-check.py
