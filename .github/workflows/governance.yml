name: FoundRy governance

on:
  push:
    paths:
      - "manifest.yaml"
      - "registry/**"
      - "schemas/**"
      - "_template/**"
      - "scripts/governance.py"
      - "scripts/governance-check.py"
      - "scripts/manifest-audit.py"
      - "scripts/registry-audit.py"
      - "scripts/capability-migration-audit.py"
      - "tests/test-capability-migration-audit.py"
      - "capabilities/**"
      - "scripts/foundry-sync.py"
      - "scripts/public-graduation-audit.py"
      - "tests/test-public-graduation-audit.py"
      - "tests/test-governance-check.py"
      - ".agents/skills/okhp3-replit-repl-janitor/**"
      - ".github/workflows/governance.yml"
      - "examples/release-candidates/**"
      - "docs/publication-boundary.md"
  pull_request:
    paths:
      - "manifest.yaml"
      - "registry/**"
      - "schemas/**"
      - "_template/**"
      - "scripts/governance.py"
      - "scripts/governance-check.py"
      - "scripts/manifest-audit.py"
      - "scripts/registry-audit.py"
      - "scripts/capability-migration-audit.py"
      - "tests/test-capability-migration-audit.py"
      - "capabilities/**"
      - "scripts/foundry-sync.py"
      - "scripts/public-graduation-audit.py"
      - "tests/test-public-graduation-audit.py"
      - "tests/test-governance-check.py"
      - ".agents/skills/okhp3-replit-repl-janitor/**"
      - ".github/workflows/governance.yml"
      - "examples/release-candidates/**"
      - "docs/publication-boundary.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test reviewed branch deletion preconditions
        run: python3 .agents/skills/okhp3-replit-repl-janitor/tests/test_audit_repo.py
      - name: Test governance runner failure propagation
        run: python3 tests/test-governance-check.py
      - name: Test capability migration gates
        run: python3 tests/test-capability-migration-audit.py
      - name: Run complete governance validation
        run: |
          runner_output="$(mktemp)"
          trap 'rm -f "$runner_output"' EXIT

          set +e
          python3 scripts/governance-check.py 2>&1 | tee "$runner_output"
          runner_status="${PIPESTATUS[0]}"
          set -e

          if [ "$runner_status" -ne 0 ]; then
            {
              echo "## Governance validation failed"
              echo
              echo "The unified governance runner stopped at the first failing check."
              echo
              echo '```text'
              cat "$runner_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$runner_status"
