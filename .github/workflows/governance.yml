name: FoundRy governance

on:
  push:
    paths:
      - "manifest.yaml"
      - "registry/**"
      - "schemas/**"
      - "_template/**"
      - "scripts/governance.py"
      - "scripts/governance-check.py"
      - "scripts/manifest-audit.py"
      - "scripts/registry-audit.py"
      - "scripts/foundry-sync.py"
      - "scripts/public-graduation-audit.py"
      - "tests/test-public-graduation-audit.py"
      - "examples/release-candidates/**"
      - "docs/publication-boundary.md"
  pull_request:
    paths:
      - "manifest.yaml"
      - "registry/**"
      - "schemas/**"
      - "_template/**"
      - "scripts/governance.py"
      - "scripts/governance-check.py"
      - "scripts/manifest-audit.py"
      - "scripts/registry-audit.py"
      - "scripts/foundry-sync.py"
      - "scripts/public-graduation-audit.py"
      - "tests/test-public-graduation-audit.py"
      - "examples/release-candidates/**"
      - "docs/publication-boundary.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run complete governance validation
        run: |
          runner_output="$(mktemp)"
          trap 'rm -f "$runner_output"' EXIT

          set +e
          python3 scripts/governance-check.py 2>&1 | tee "$runner_output"
          runner_status="${PIPESTATUS[0]}"
          set -e

          if [ "$runner_status" -ne 0 ]; then
            {
              echo "## Governance validation failed"
              echo
              echo "The unified governance runner stopped at the first failing check."
              echo
              echo '```text'
              cat "$runner_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$runner_status"
