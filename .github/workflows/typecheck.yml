name: Typecheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Validate ReFolDec examples
        run: python3 scripts/refoldec-validate.py examples/refoldec-fixtures/valid examples/raw-thought-to-artifact.md examples/release-candidates

      - name: Test ReFolDec failure fixtures
        run: python3 tests/test-refoldec-validator.py
