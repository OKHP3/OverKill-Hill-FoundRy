    declared: Espresso, teal, rust, orange, paper, amber, olive, and ochre values; Alfa Slab One, DM Sans, and JetBrains Mono roles.
    observed: Dense but deliberate technical editorial rhythm with forged and schematic metaphors.
    inferred: Precise, capable, and heat-tempered rather than sterile.
  evidence:
    - claim: "The core palette includes teal, espresso, rust, orange, amber, olive, ochre, and paper values."
      source: https://github.com/OKHP3/OverKill-Hill/blob/main/assets/css/theme.css
      authority: declared
      confidence: high
      notes: "Read from the declared theme source."
    - claim: "The visual narrative is a technical forge with schematic and durable-material cues."
