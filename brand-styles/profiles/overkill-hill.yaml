      source: https://raw.githubusercontent.com/OKHP3/OverKill-Hill/main/assets/css/theme.css
      authority: declared
      confidence: high
      notes: "Three-way ☀/⊙/☾ toggle added to SPA topbar; no-flash inline script prevents FOUC; system mode resolves via matchMedia."
