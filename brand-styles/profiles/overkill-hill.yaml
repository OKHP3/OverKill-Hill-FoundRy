  tokens:
    color:
      foundation:
        teal: "#1c3a34"
        olive: "#676a2c"
        ochre: "#a06e28"
        rust: "#5b3a27"
        espresso: "#2a2320"
        orange: "#c46a2c"
        amber: "#e6a03c"
        paper: "#f6f2ee"
      semantic:
        accent: "#c46a2c"
        dark_surface: "#111827"
        dark_surface_soft: "#181f26"
        dark_foreground: "#e5e7eb"
    typography:
      roles:
        heading: { family: Alfa Slab One, fallback: [sans-serif], notes: Use for decisive, display-level moments. }
        body: { family: DM Sans, fallback: [sans-serif], notes: Use for clear working prose and UI. }
        mono: { family: JetBrains Mono, fallback: [monospace], notes: Use for technical labels and structured details. }
    geometry:
      spacing: { xs: 0.25rem, sm: 0.5rem, md: 1rem, lg: 2rem, xl: 4rem, xxl: 8rem }
      radius: { md: 0.75rem, lg: 1.25rem }
      shadow: { soft: "0 18px 40px rgba(0, 0, 0, 0.5)" }
      content_width: 1120px
    motion:
      feedback: 150ms        # immediate hover/focus response
      transition: 300ms      # measured state changes (progress bars, panel slides)
  direction:
    visual_narrative: Precision, protocol, and promptcraft on an active workshop floor.
    components: [dark technical surfaces, orange process accents, deliberate status labels, schematic detail]
    imagery: [mechanical, workshop, blueprint, durable material metaphor]
    motion: [fast 150ms feedback, measured 300ms transitions]
    avoid: [generic neon cyberpunk, sterile enterprise gradients, whimsical decorative overload]
  application:
    suitable_targets: [spa, documentation, presentation, image-brief]
    active_surfaces:
      - id: custom-gpt-creator-spa
        path: artifacts/mockup-sandbox
        token_layer: artifacts/mockup-sandbox/src/index.css
        applied_on: 2026-08-07
        notes: >
          All foundation and semantic tokens mapped. Motion timing aligned to 150ms/300ms.
          Brand name cardinal rule applied to sidebar logo and footer instances.
          Olive and ochre tokens added to token layer for palette completeness.
    accessibility_notes:
      - Verify contrast for orange-on-dark controls (accent #c46a2c on bg #111827 ≈ 3.9:1 — passes AA for large/bold text; review for body-size orange text)
      - Preserve visible keyboard focus (:focus-visible with 2px accent outline — applied)
      - Retain text alternatives for metaphorical imagery (forge mark ⚙ is decorative, no alt needed)
    target_constraints:
      - Preserve existing SPA behavior and framework conventions
      - Verify font availability and licensing before shipping (Google Fonts via preconnect — confirmed)
      - Do not rewrite generated files or page components for style-only changes
    acceptance_checks:
      - Token layer reviewed and all foundation tokens present ✓
      - Representative desktop viewport inspected ✓
      - Keyboard focus checked (:focus-visible applied globally) ✓
      - Contrast checked for accent-on-dark states (3.9:1 — AA large text) ✓
      - Motion timing aligned to profile (150ms feedback, 300ms transitions) ✓
      - Brand name cardinal rule applied to all rendered instances ✓
  conflicts: [none recorded]
  confidence: { overall: high, notes: All foundation tokens declared and verified in the applied token layer. }
