kind = "web"
previewPath = "/"
title = "OKH Found·Ry"
description = "The OKH Found·Ry brand landing page — a full-screen forge-aesthetic hero for OverKill Hill P³. Precision dark industrial design with ember glows, schematic corner marks, blueprint grid, and animated entry. Serves as the go-forward home for the OKH Found·Ry product suite."
version = "1.0.0"
id = "artifacts/okh-foundry-landing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20360

[services.development]
run = "pnpm --filter @workspace/okh-foundry-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/okh-foundry-landing", "run", "build" ]
serve = "static"
publicDir = "artifacts/okh-foundry-landing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20360"
BASE_PATH = "/"
