kind = "web"
previewPath = "/"
title = "OKH Found·Ry"
description = "The OKH Found·Ry Paper Forge — a warm editorial conversation workspace for shaping Custom GPT specifications through dialogue, an emerging brief, phase navigation, preview, and export."
version = "1.0.0"
id = "artifacts/okh-foundry-landing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20360

[services.development]
run = "pnpm --filter @workspace/okh-foundry-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/okh-foundry-landing", "run", "build" ]
serve = "static"
publicDir = "artifacts/okh-foundry-landing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20360"
BASE_PATH = "/"
