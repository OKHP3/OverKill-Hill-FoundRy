    <!-- ── No-flash theme: resolves preference before first paint ── -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('forge-theme') || 'system';
          var t = p === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : p;
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
