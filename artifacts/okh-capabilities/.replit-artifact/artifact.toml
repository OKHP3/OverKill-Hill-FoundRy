kind = "web"
previewPath = "/okh-capabilities/"
title = "Forge Capabilities"
description = "A conversation-first OverKill Hill FoundRy workspace that turns a maker's intent into an emerging GPT specification, with live assembly progress, traceable decisions, phase navigation, persistence, preview, and export."
version = "1.0.0"
id = "artifacts/okh-capabilities"
router = "path"

[[services]]
name = "web"
paths = [ "/okh-capabilities/" ]
localPort = 20633

[services.development]
run = "pnpm --filter @workspace/okh-capabilities run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/okh-capabilities", "run", "build" ]
serve = "static"
publicDir = "artifacts/okh-capabilities/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20633"
BASE_PATH = "/okh-capabilities/"
